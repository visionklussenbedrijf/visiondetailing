<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision Detailing</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Vision Detailing</h1>
        <p>Bel ons: <a href="tel:0643815262">0643815262</a></p>
    </header>

    <main>
        <section class="intro">
            <h2>Welkom bij Vision Detailing</h2>
            <p>Wij verzorgen hoogwaardige detailing services in Amsterdam en omgeving.</p>
        </section>

        <section class="contact-form">
            <h2>Stel direct je vraag</h2>
            <form action="https://formspree.io/f/yourformid" method="POST">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="_replyto" required />

                <label for="message">Vraag:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Verstuur</button>
            </form>
            <p><small>Vervang <code>yourformid</code> in de form actie met je Formspree ID.</small></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Vision Detailing</p>
    </footer>
</body>
</html>
